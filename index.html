      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  } catch (e) { console.error("pdf.js 초기화 실패:", e); }

  function arrToObj(arr) { const o = {}; (arr || []).forEach((item) => { o[item.id] = item; }); return o; }
  function objToArr(obj) { return obj ? Object.keys(obj).map((k) => ({ ...obj[k], id: k })) : []; }

  function genId() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function fmt(d) { return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`; }
  function fmtWeekday(d) { const w = ["일","월","화","수","목","금","토"][d.getDay()]; return `${fmt(d)} (${w})`; }
  function addYears(d, n) { return new Date(d.getFullYear() + n, d.getMonth(), d.getDate()); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function fullMonthsBetween(a, b) { let months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); if (b.getDate() < a.getDate()) months--; return Math.max(0, months); }
  function fullYearsBetween(a, b) { let years = b.getFullYear() - a.getFullYear(); const anniv = new Date(a.getFullYear() + years, a.getMonth(), a.getDate()); if (anniv > b) years--; return Math.max(0, years); }
  function round1(n) { return Math.round(n * 10) / 10; }
  function roundUp(n) { return Math.ceil(n - 1e-9); } // 실제 지급/반영 값은 올림 처리 (산출 근거의 소수는 그대로 표기)
  function dateToStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  // 시작일로부터 주말(토/일)을 제외하고 totalDays만큼 이어지는 날짜들을 구함 (예: 금요일 시작 2일 → 금, 월)
  function expandToBusinessDays(startStr, totalDays) {
    const result = [];
    let remaining = Number(totalDays) || 0;
    let cur = parseDate(startStr);
    if (!cur || remaining <= 0) return result;
    let guard = 0;
    while (remaining > 0 && guard < 60) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) {
        const portion = remaining >= 1 ? 1 : remaining;
        result.push({ date: dateToStr(cur), portion });
        remaining = round1(remaining - portion);
      }
      cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
      guard++;
    }
    return result;
  }
  function annualFormula(serviceYears) { return Math.min(25, 15 + Math.floor((serviceYears - 1) / 2)); }

  // ---- 퇴사자 연차 정산: 입사일 기준 vs 회계연도 기준 누적 발생량 비교 ----
  function cumulativeAnniversary(hireDate, endDate) {
    const detail = [];
    const firstAnniv = addYears(hireDate, 1);
    const firstYearEnd = endDate < firstAnniv ? endDate : firstAnniv;
    const monthsInFirstYear = fullMonthsBetween(hireDate, firstYearEnd);
    const firstYearMonthly = Math.min(11, monthsInFirstYear);
    let total = firstYearMonthly;
    detail.push({ label: "1년차 개근연차(월 1일, 최대 11일)", days: firstYearMonthly });
    if (endDate <= firstAnniv) return { total: roundUp(total), detail, completedTotal: 0 };

    // 매 기념일에 도달하는 즉시 그 시점의 정식 연차를 지급 (완성된 연차만 인정 — 법정 최소 기준)
    let serviceYear = 1;
    let cursor = firstAnniv;
    while (cursor <= endDate) {
      const grant = annualFormula(serviceYear);
      total += grant;
      detail.push({ label: `${serviceYear}주년(${fmt(cursor)}) 정식 지급`, days: grant });
      serviceYear++;
      cursor = addYears(hireDate, serviceYear);
    }
    // 마지막 미완성 구간(다음 기념일 전)은 아직 만 1년이 안 지났으므로 추가 지급 없음
    const completedTotal = round1(detail.slice(0, -1).reduce((s, d) => s + d.days, 0));
    return { total: roundUp(total), detail, completedTotal };
  }
  function cumulativeFiscal(hireDate, endDate) {
    const detail = [];
    const hireYear = hireDate.getFullYear();
    const hireYearEnd = new Date(hireYear, 11, 31);
    const daysInHireYear = daysBetween(hireDate, hireYearEnd) + 1;
    const nextJan1 = new Date(hireYear + 1, 0, 1);

    if (endDate < nextJan1) {
      // 아직 입사연도 안(첫 회계연도 전환 전): 월차만 인정, 비례연차는 미지급 상태
      const monthsWorked = fullMonthsBetween(hireDate, endDate);
      const monthlyLeave = Math.min(11, monthsWorked);
      detail.push({ label: "입사연도 개근연차(월 1일, 최대 11일)", days: monthlyLeave });
      return { total: roundUp(monthlyLeave), detail, completedTotal: 0 };
    }

    // 입사연도 비례연차: 15/365 비례가 최대 11일의 월차 기준을 항상 상회하므로,
    // 월차를 별도로 더하지 않고 비례연차로 대체(중복 합산 방지)
    const hireYearProrate = round1(15 * (daysInHireYear / 365));
    let total = hireYearProrate;
    detail.push({ label: `입사연도 비례연차(${fmt(nextJan1)} 지급 기준, ${daysInHireYear}일/365 — 월차 대체)`, days: hireYearProrate });

    let year = hireYear + 1;
    while (true) {
      const jan1 = new Date(year, 0, 1);
      const nextJan1b = new Date(year + 1, 0, 1);
      const serviceYears = year - hireYear;
      if (nextJan1b <= endDate) {
        const grant = annualFormula(serviceYears);
        total += grant;
        detail.push({ label: `${year}.01.01 근속 ${serviceYears}년차 정식 지급`, days: grant });
        year++;
      } else {
        const yearEnd = new Date(year, 11, 31);
        const lastDay = endDate < yearEnd ? endDate : yearEnd;
        const daysThisYear = daysBetween(jan1, lastDay) + 1;
        const grant = round1(annualFormula(serviceYears) * (daysThisYear / 365));
        total += grant;
        detail.push({ label: `${year}.01.01 근속 ${serviceYears}년차, 퇴사연도 비례(${daysThisYear}일/365)`, days: grant });
        break;
      }
    }
    const completedTotal = round1(detail.slice(0, -1).reduce((s, d) => s + d.days, 0));
    return { total: roundUp(total), detail, completedTotal };
  }
  function todayLocalStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- 전자결재 문서(PDF/Excel) 자동 인식 ----
  // PDF에서 추출되는 텍스트는 라벨 글자 사이사이에 공백이 끼어드는 경우가 많아(예: "휴 가 신 청 일"),
  // 공백을 완전히 제거한 compact 버전으로 라벨/날짜/숫자를 찾고, 사유처럼 자연스러운 문장은
  // 공백을 한 칸으로 정리한 flat 버전에서 찾는다.
  function guessTypeFromText(text) {
    return /대체\s*휴가|대체휴가/.test(text) ? "comp" : "annual";
  }
  function extractDateNearLabel(compact) {
    // 1) "기안일" 라벨 뒤에 오는 날짜를 먼저 파악해서 제외 대상으로 삼음
    let gianDate = null;
    const gianIdx = compact.indexOf("기안일");
    if (gianIdx !== -1) {
      const gm = compact.slice(gianIdx, gianIdx + 30).match(/(\d{4}-\d{2}-\d{2})/);
      if (gm) gianDate = gm[1];
    }
    // 2) "신청일"이라는 글자가 붙어있는 라벨(휴가신청일) 뒤 넓은 범위에서 날짜를 탐색
    //    (기안일과 같은 날짜가 먼저 걸리면 건너뛰고 다른 날짜를 찾음)
    const reqIdx = compact.search(/신청일/);
    if (reqIdx !== -1) {
      const windowMatches = [...compact.slice(reqIdx, reqIdx + 60).matchAll(/(\d{4}-\d{2}-\d{2})/g)].map((m) => m[1]);
      const differing = windowMatches.find((d) => d !== gianDate);
      if (differing) return differing;
      if (windowMatches.length) return windowMatches[0];
    }
    // 3) 라벨 탐색이 실패하면, 문서에 있는 날짜 중 기안일 날짜와 다른 것을 채택
    const allDates = [...compact.matchAll(/(\d{4}-\d{2}-\d{2})/g)].map((m) => m[1]);
    const uniqDates = [...new Set(allDates)];
    const other = uniqDates.find((d) => d !== gianDate);
    return other || uniqDates[0] || "";
  }
  const TITLE_WORDS = "(주임|사원|대리|과장|차장|부장|팀장|실장|이사|대표)";
  function extractFieldsFromText(text) {
    const flat = text.replace(/\s+/g, " ");
    const compact = text.replace(/\s+/g, "");
    const nameMatch =
      compact.match(new RegExp(`기안자([가-힣]{2,4})${TITLE_WORDS}`)) ||
      compact.match(/기안자([가-힣]{2,3})/);
    const dateMatch = extractDateNearLabel(compact);
    const daysMatch = compact.match(/신청휴가수([\d.]+)d/i);
    const reasonMatch =
      flat.match(/([가-힣][가-힣\s]{5,80})\.?\s*$/) ||
      flat.match(/신청사유[^가-힣]*([가-힣][^d]{2,60}?)(?:연차|대체휴가|휴가신청일|보유휴가|$)/);
    return {
      name: nameMatch ? nameMatch[1] : "",
      date: dateMatch || "",
      days: daysMatch ? Number(daysMatch[1]) : 1,
      reason: reasonMatch ? reasonMatch[1].trim() : "",
      type: guessTypeFromText(compact),
    };
  }
  async function parsePdfFile(file) {
    if (typeof pdfjsLib === "undefined") throw new Error("PDF 라이브러리를 불러오지 못했습니다.");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map((it) => it.str).join(" ") + "\n";
    }
    return { rows: [extractFieldsFromText(text)], rawText: text };
  }
  async function parseExcelFile(file) {
    if (typeof XLSX === "undefined") throw new Error("엑셀 라이브러리를 불러오지 못했습니다.");
    const buf = await file.arrayBuffer();
    // cellDates 옵션은 시간대에 따라 날짜가 하루 앞뒤로 밀리는 문제가 있어 사용하지 않음.
    // 날짜 셀은 순수 일련번호(raw)로 받아서 SSF.parse_date_code로 직접 계산 → 시간대 영향 전혀 없음.
    const wb = XLSX.read(buf, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    if (!json.length) return { rows: [], rawText: null };
    const keys = Object.keys(json[0]);
    const findKey = (patterns) => keys.find((k) => patterns.some((p) => k.includes(p)));
    const kName = findKey(["기안자", "성명", "이름", "신청자", "직원", "담당자"]);
    const kDate = findKey(["휴가신청일", "신청일", "날짜", "일자"]);
    const kDays = findKey(["신청 휴가수", "휴가수", "일수"]);
    const kReason = findKey(["신청사유", "사유"]);
    const kType = findKey(["휴가유형", "유형"]);
    function cellToDateStr(val) {
      // 엑셀 날짜 일련번호(예: 46206) - 시간대와 무관하게 정확한 날짜 계산
      const num = Number(val);
      if (val !== "" && !isNaN(num) && num > 20000 && num < 90000) {
        const parsed = XLSX.SSF.parse_date_code(num);
        if (parsed) return `${parsed.y}-${String(parsed.m).padStart(2, "0")}-${String(parsed.d).padStart(2, "0")}`;
      }
      if (val instanceof Date && !isNaN(val)) return dateToStr(val);
      const s = String(val || "");
      const m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
      return "";
    }
    const rows = json.map((row) => {
      const rawDays = String(row[kDays] || "").match(/[\d.]+/);
      return {
        name: String(row[kName] || "").replace(/\s*(주임|사원|대리|과장|차장|부장|팀장|실장|이사|대표).*$/, "").trim(),
        date: cellToDateStr(row[kDate]),
        days: rawDays ? Number(rawDays[0]) : 1,
        reason: String(row[kReason] || "").trim(),
        type: guessTypeFromText(String(row[kType] || "")),
      };
    });
    return { rows, rawText: JSON.stringify(json, null, 2) };
  }

  function dateGroupHtml(extraClass, y, m, d) {
    return `<div class="date-group ${extraClass || ""}">
      <input type="text" inputmode="numeric" maxlength="4" class="dg-y" placeholder="YYYY" value="${y || ""}" />
      <span class="dg-sep">-</span>
      <input type="text" inputmode="numeric" maxlength="2" class="dg-m" placeholder="MM" value="${m || ""}" />
      <span class="dg-sep">-</span>
      <input type="text" inputmode="numeric" maxlength="2" class="dg-d" placeholder="DD" value="${d || ""}" />
    </div>`;
  }
  function wireDateGroup(groupEl) {
    if (!groupEl) return;
    const y = groupEl.querySelector(".dg-y"), m = groupEl.querySelector(".dg-m"), d = groupEl.querySelector(".dg-d");
    y.addEventListener("input", () => { y.value = y.value.replace(/\D/g, "").slice(0, 4); if (y.value.length === 4) m.focus(); });
    m.addEventListener("input", () => { m.value = m.value.replace(/\D/g, "").slice(0, 2); if (m.value.length === 2) d.focus(); });
    d.addEventListener("input", () => { d.value = d.value.replace(/\D/g, "").slice(0, 2); });
    m.addEventListener("keydown", (e) => { if (e.key === "Backspace" && m.value === "") y.focus(); });
    d.addEventListener("keydown", (e) => { if (e.key === "Backspace" && d.value === "") m.focus(); });
    [y, m, d].forEach((el) => el.addEventListener("blur", () => {
      if (m.value && m.value.length === 1) m.value = m.value.padStart(2, "0");
      if (d.value && d.value.length === 1) d.value = d.value.padStart(2, "0");
    }));
  }
  function getDateGroupValue(groupEl) {
    if (!groupEl) return null;
    const y = groupEl.querySelector(".dg-y").value;
    let m = groupEl.querySelector(".dg-m").value, d = groupEl.querySelector(".dg-d").value;
    if (y.length !== 4 || !m || !d) return null;
    m = m.padStart(2, "0"); d = d.padStart(2, "0");
    if (Number(m) < 1 || Number(m) > 12 || Number(d) < 1 || Number(d) > 31) return null;
    return `${y}-${m}-${d}`;
  }

  function calcLeave(hireDate, baseDate) {
    const hireYear = hireDate.getFullYear();
    const nextJan1 = new Date(hireYear + 1, 0, 1);

    if (baseDate < nextJan1) {
      // 입사연도(첫 회계연도 전환 전): 매월 개근 시 1일(최대 11일), 비례연차는 다음 해 1월 1일에 지급 예정(대기 상태)
      const monthsWorked = fullMonthsBetween(hireDate, baseDate);
      const monthlyLeave = Math.min(11, monthsWorked);
      const hireYearEnd = new Date(hireYear, 11, 31);
      const daysInHireYear = daysBetween(hireDate, hireYearEnd) + 1;
      const proRated = round1((15 * daysInHireYear) / 365);
      return { statusKey: "a", statusLabel: "입사연도(비례연차 대기)", granted: monthlyLeave, anniversary: nextJan1, proRated,
        detail: `개근 가정 시 월차 ${monthlyLeave}일 발생(최대 11일) · 비례연차 ${proRated}일은 ${fmt(nextJan1)}에 지급 예정` };
    }

    const baseYear = baseDate.getFullYear();
    const yearsSinceHire = baseYear - hireYear; // 1 = 입사연도 바로 다음 해(전환연도), 2 = 그 다음 해...
    const jan1ThisYear = new Date(baseYear, 0, 1);

    if (yearsSinceHire === 1) {
      // 전환연도: 입사연도에 실제 근무한 기간에 비례하는 비례연차를 지급.
      // 비례연차(15/365 비례)는 어떤 경우에도 월차 기준(최대 11일)을 상회하므로,
      // 월차를 별도로 더하지 않고 비례연차로 대체(중복 합산 방지)
      const hireYearEnd = new Date(hireYear, 11, 31);
      const daysInHireYear = daysBetween(hireDate, hireYearEnd) + 1;
      const proRated = roundUp((15 * daysInHireYear) / 365);
      return { statusKey: "b", statusLabel: "정상 편입(비례연차 지급)", granted: proRated, anniversary: null, proRated: 0,
        detail: `${fmt(jan1ThisYear)} 입사연도 비례연차 지급(재직 ${daysInHireYear}일/365 → 15일 중 비례, 월차 대체)` };
    }
    const serviceYears = yearsSinceHire - 1;
    const annual = annualFormula(Math.max(1, serviceYears));
    return { statusKey: "b", statusLabel: "정상 편입", granted: annual, anniversary: null, proRated: 0,
      detail: `${fmt(jan1ThisYear)} 기준 근속 ${serviceYears}년차 → 연차 ${annual}일 일괄 발생` };
  }

  function computeResignSettlement(active) {
    const hire = parseDate(active.hireDate);
    const resign = parseDate(active.resignDate);
    const methodA = cumulativeAnniversary(hire, resign);
    const methodB = cumulativeFiscal(hire, resign);
    const chosen = methodA.total >= methodB.total ? "A" : "B";
    const grantedAnnual = Math.max(methodA.total, methodB.total);
    const usageLog = active.usageLog || [];
    const usedAnnual = round1(usageLog.filter((u) => u.type === "annual").reduce((s, u) => s + (Number(u.days) || 0), 0));
    const usedComp = round1(usageLog.filter((u) => u.type === "comp").reduce((s, u) => s + (Number(u.days) || 0), 0));
    const compGranted = Number(active.compGranted) || 0;
    const remainingAnnual = round1(grantedAnnual - usedAnnual);
    // 촉진 대상 자동 추정: "1·2차 촉구를 매년 적법하게 완료했다"는 가정 하에,
    // 이미 만료된(완성된) 사이클의 발생분은 촉진 대상으로 보고, 퇴사일이 포함된 마지막(아직 미만료) 사이클은 제외
    const chosenCompletedTotal = chosen === "A" ? methodA.completedTotal : methodB.completedTotal;
    const autoPromoted = round1(Math.min(chosenCompletedTotal, remainingAnnual));
    const promotedDays = active.promotedDaysOverride != null ? Number(active.promotedDaysOverride) : autoPromoted;
    const payableAnnual = Math.max(0, round1(remainingAnnual - promotedDays));
    return {
      methodA, methodB, chosen, grantedAnnual,
      usedAnnual, remainingAnnual,
      autoPromoted, promotedDays, payableAnnual,
      compGranted, usedComp, remainingComp: round1(compGranted - usedComp),
    };
  }

  function render() {
    const root = document.getElementById("leave-app");
    root.innerHTML = `<div class="loading-msg">대시보드를 불러오는 중…</div>`;

    let roster = [];
    let leaveLog = [];
    let grantLog = [];
    let resignations = [];
    let editingId = null;
    let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    let currentPage = "home";
    let selectedStat = null;
    let docPreviewRows = null;
    let resignActive = null; // 현재 작업 중인(아직 저장 전) 퇴사 정산 초안
    let resignDocPreviewRows = null;
    let resignDocParseError = null;
    let resignDocRawText = null;
    let docParseError = null;
    let docStatusMessage = null;
    let docRawText = null;

    async function load() {
      if (fbDb) {
        // 실시간 동기화: 다른 사용자의 변경도 자동으로 반영됨
        fbDb.ref("roster").on("value", (snap) => { roster = objToArr(snap.val()); paint(); });
        fbDb.ref("logs").on("value", (snap) => { leaveLog = objToArr(snap.val()); paint(); });
        fbDb.ref("grants").on("value", (snap) => { grantLog = objToArr(snap.val()); paint(); });
        fbDb.ref("resignations").on("value", (snap) => { resignations = objToArr(snap.val()); paint(); });

        // 최초 1회: Firebase가 비어있고 이 브라우저에 기존 로컬 데이터가 있으면 업로드해서 이어받기
        fbDb.ref("roster").once("value").then((snap) => {
          if (!snap.val()) {
            try {
              const rawV2 = localStorage.getItem(ROSTER_KEY);
              const localRoster = rawV2 ? JSON.parse(rawV2) : [];
              if (localRoster.length) {
                fbDb.ref("roster").set(arrToObj(localRoster));
                const rawLog = localStorage.getItem(LOG_KEY);
                const localLog = rawLog ? JSON.parse(rawLog) : [];
                if (localLog.length) fbDb.ref("logs").set(arrToObj(localLog));
              }
            } catch (e) { /* 무시 */ }
          }
        });

        // 기존 방식(직원별 고정 "대체휴가 발생" 숫자)으로 입력된 데이터를 발생 내역(사유: 기존 데이터 이전)으로 1회 변환
        Promise.all([fbDb.ref("roster").once("value"), fbDb.ref("grants").once("value")]).then(([rSnap, gSnap]) => {
          if (gSnap.val()) return; // 이미 발생 내역이 있으면 건너뜀
          const rArr = objToArr(rSnap.val());
          const toMigrate = rArr.filter((r) => Number(r.compGranted) > 0);
          if (!toMigrate.length) return;
          const grants = {};
          const clearedRoster = {};
          toMigrate.forEach((r) => {
            const gid = genId();
            grants[gid] = { id: gid, empId: r.id, date: todayLocalStr(), days: Number(r.compGranted), reason: "기존 데이터 이전" };
          });
          rArr.forEach((r) => { clearedRoster[r.id] = { ...r, compGranted: 0 }; });
          fbDb.ref("grants").set(grants);
          fbDb.ref("roster").set(clearedRoster);
        });

        startAutoRefresh();
        return;
      }

      // Firebase 연결 실패 시: 이 브라우저에만 저장되는 기존 방식으로 대체
      try {
        const rawLog = localStorage.getItem(LOG_KEY);
        leaveLog = rawLog ? JSON.parse(rawLog) : [];
      } catch (e) { leaveLog = []; }
      try {
        const rawGrant = localStorage.getItem(GRANT_KEY);
        grantLog = rawGrant ? JSON.parse(rawGrant) : [];
      } catch (e) { grantLog = []; }
      try {
        const rawResign = localStorage.getItem(RESIGN_KEY);
        resignations = rawResign ? JSON.parse(rawResign) : [];
      } catch (e) { resignations = []; }
      try {
        const rawV2 = localStorage.getItem(ROSTER_KEY);
        if (rawV2) {
          roster = JSON.parse(rawV2);
        } else {
          const rawV1 = localStorage.getItem(ROSTER_KEY_V1);
          const v1 = rawV1 ? JSON.parse(rawV1) : [];
          roster = v1.map((r) => {
            const id = genId();
            const usedNum = Number(r.used) || 0;
            if (usedNum > 0) leaveLog.push({ id: genId(), empId: id, date: todayLocalStr(), type: "annual", days: usedNum });
            return { id, name: r.name || "", hireDate: r.hireDate, compGranted: 0 };
          });
          if (roster.length) { saveRoster(); saveLog(); }
        }
        // 기존 compGranted 값을 발생 내역으로 1회 변환
        if (!grantLog.length) {
          const toMigrate = roster.filter((r) => Number(r.compGranted) > 0);
          if (toMigrate.length) {
            toMigrate.forEach((r) => { grantLog.push({ id: genId(), empId: r.id, date: todayLocalStr(), days: Number(r.compGranted), reason: "기존 데이터 이전" }); r.compGranted = 0; });
            saveRoster(); saveGrant();
          }
        }
      } catch (e) { roster = []; }
      paint();
      startAutoRefresh();
    }

    async function saveRoster() {
      if (fbDb) { try { await fbDb.ref("roster").set(arrToObj(roster)); } catch (e) { console.error("Firebase 저장 실패", e); } return; }
      try { localStorage.setItem(ROSTER_KEY, JSON.stringify(roster)); } catch (e) { console.error("저장 실패", e); }

      if (fbDb) { try { await fbDb.ref("logs").set(arrToObj(leaveLog)); } catch (e) { console.error("Firebase 저장 실패", e); } return; }
      try { localStorage.setItem(LOG_KEY, JSON.stringify(leaveLog)); } catch (e) { console.error("저장 실패", e); }

    async function saveGrant() {
      if (fbDb) { try { await fbDb.ref("grants").set(arrToObj(grantLog)); } catch (e) { console.error("Firebase 저장 실패", e); } return; }
      try { localStorage.setItem(GRANT_KEY, JSON.stringify(grantLog)); } catch (e) { console.error("저장 실패", e); }

      try { localStorage.setItem(RESIGN_KEY, JSON.stringify(resignations)); } catch (e) { console.error("저장 실패", e); }

    function startAutoRefresh() {
      lastDateStr = todayLocalStr();

      }, 60 * 1000);

        if (document.visibilityState === "visible") {
          const cur = todayLocalStr();
          if (cur !== lastDateStr) { lastDateStr = cur; paint(); }
        }
      });
    }

    function sumLeave(empId, type) {
      return round1(leaveLog.filter((l) => l.empId === empId && l.type === type).reduce((s, l) => s + (Number(l.days) || 0), 0));
    }
    function sumGrant(empId) {
      return round1(grantLog.filter((g) => g.empId === empId).reduce((s, g) => s + (Number(g.days) || 0), 0));
    }

    function exportExcel() {
      if (typeof XLSX === "undefined") { alert("엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요."); return; }
      const today = new Date();
      const summary = computeAll(today).map((c) => ({
        "이름": c.name, "입사일": fmt(c.hireDate), "상태": c.statusLabel,
        "연차발생": c.granted, "연차사용": c.usedAnnual, "연차잔여": c.remainingAnnual,
        "대체휴가발생": c.compGranted, "대체휴가사용": c.compUsed, "대체휴가잔여": c.compRemaining,
      }));
      const logRows = leaveLog
        .slice()
        .sort((a, b) => (a.date < b.date ? -1 : 1))
        .map((l) => {
          const emp = roster.find((r) => r.id === l.empId);
          return { "이름": emp ? emp.name : "(삭제된 직원)", "날짜": l.date, "유형": l.type === "annual" ? "연차" : "대체휴가", "일수": l.days, "사유": l.reason || "" };
        });
      const grantRows = grantLog
        .slice()
        .sort((a, b) => (a.date < b.date ? -1 : 1))
        .map((g) => {
          const emp = roster.find((r) => r.id === g.empId);
          return { "이름": emp ? emp.name : "(삭제된 직원)", "날짜": g.date, "일수": g.days, "사유": g.reason || "" };
        });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "직원현황");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logRows), "휴가사용내역");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grantRows), "대체휴가발생내역");
      XLSX.writeFile(wb, `연차현황_${todayLocalStr()}.xlsx`);
    }

    function computeAll(today) {
      return roster.map((r) => {
        const hireDate = parseDate(r.hireDate);
        const result = calcLeave(hireDate, today);
        const usedAnnual = sumLeave(r.id, "annual");
        const compGranted = sumGrant(r.id);
        const compUsed = sumLeave(r.id, "comp");
        return {
          id: r.id, name: r.name || "-", hireDate, usedAnnual,
          remainingAnnual: round1(result.granted - usedAnnual),
          compGranted, compUsed, compRemaining: round1(compGranted - compUsed),
          ...result,
        };
      });
    }

    function paint() {
      const today = new Date();
      const computed = computeAll(today).filter((c) => c.hireDate);

      const countA = computed.filter((c) => c.statusKey === "a").length;
      const countB = computed.filter((c) => c.statusKey === "b").length;


      const upcoming = computed
        .filter((c) => c.anniversary && c.anniversary >= today)
        .map((c) => ({ ...c, dday: daysBetween(today, c.anniversary) }))
        .filter((c) => c.dday <= 90)
        .sort((a, b) => a.dday - b.dday);

      const empOptions = roster.map((r) => `<option value="${r.id}">${escapeHtml(r.name || "(이름없음)")}</option>`).join("");
      function empOptionsWithSelected(selectedId, unmatchedName) {
        const opts = roster.map((r) => `<option value="${r.id}" ${r.id === selectedId ? "selected" : ""}>${escapeHtml(r.name || "(이름없음)")}</option>`).join("");
        const unmatched = !selectedId && unmatchedName ? `<option value="" selected>⚠ "${escapeHtml(unmatchedName)}" 일치하는 직원 없음</option>` : "";
        return unmatched + opts || `<option value="">등록된 직원 없음</option>`;
      }

      const rows = computed
        .sort((a, b) => a.hireDate - b.hireDate)
        .map((c) => {
          if (c.id === editingId) {
            const y = c.hireDate.getFullYear(), m = String(c.hireDate.getMonth() + 1).padStart(2, "0"), d = String(c.hireDate.getDate()).padStart(2, "0");
            return `
          <tr class="editing-row">
            <td><input type="text" class="edit-name" value="${escapeHtml(c.name)}" /></td>
            <td>${dateGroupHtml("edit-hire", y, m, d)}</td>
            <td><span class="status-pill status-${c.statusKey}">${c.statusLabel}</span></td>
            <td class="num">${c.granted}일</td>
            <td class="num">${c.usedAnnual}일</td>
            <td class="num">${c.remainingAnnual}일</td>
            <td class="num">${c.compGranted}일</td>
            <td class="num">${c.compUsed}일</td>
            <td class="num">${c.compRemaining}일</td>
            <td class="detail">저장하면 반영됩니다</td>
            <td><button class="save-btn" data-id="${c.id}">저장</button><button class="cancel-btn" data-id="${c.id}">취소</button></td>
          </tr>`;
          }
          return `
          <tr>
            <td>${escapeHtml(c.name)}</td>
            <td>${fmt(c.hireDate)}</td>
            <td><span class="status-pill status-${c.statusKey}">${c.statusLabel}</span></td>
            <td class="num">${c.granted}일</td>
            <td class="num">${c.usedAnnual}일</td>
            <td class="num">${c.remainingAnnual}일</td>
            <td class="num">${c.compGranted}일</td>
            <td class="num">${c.compUsed}일</td>
            <td class="num">${c.compRemaining}일</td>
            <td class="detail">${c.detail}</td>
            <td><button class="edit-btn" data-id="${c.id}">수정</button><button class="del-btn" data-id="${c.id}">삭제</button></td>
          </tr>`;
        })
        .join("");

      const upcomingHtml = upcoming.length
        ? upcoming.map((u) => `
          <div class="upcoming-item">
            <div><div class="name">${escapeHtml(u.name)}</div><div class="meta">${fmt(u.anniversary)} 1월 1일 · 비례연차 ${roundUp(u.proRated)}일 예정</div></div>
            <span class="dday ${u.dday <= 14 ? "urgent" : ""}">${u.dday === 0 ? "오늘" : "D-" + u.dday}</span>
          </div>`).join("")
        : `<div class="empty-mini">90일 이내 비례연차 지급 예정자가 없습니다.</div>`;

      const recentLogs = leaveLog.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 8);
      const logsHtml = recentLogs.length
        ? recentLogs.map((l) => {
            const emp = roster.find((r) => r.id === l.empId);
            return `
          <div class="log-item">
            <div><span class="log-type ${l.type}">${l.type === "annual" ? "연차" : "대체"}</span>${escapeHtml(emp ? emp.name : "(삭제됨)")} · ${l.date} · ${l.days}일${l.reason ? ` · <span class="log-reason">${escapeHtml(l.reason)}</span>` : ""}</div>
            <button class="log-del" data-id="${l.id}">삭제</button>
          </div>`;
          }).join("")
        : `<div class="empty-mini">등록된 휴가 사용 내역이 없습니다.</div>`;

      const recentGrants = grantLog.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 8);
      const grantsHtml = recentGrants.length
        ? recentGrants.map((g) => {
            const emp = roster.find((r) => r.id === g.empId);
            return `
          <div class="log-item">
            <div><span class="log-type comp">발생</span>${escapeHtml(emp ? emp.name : "(삭제됨)")} · ${g.date} · ${g.days}일${g.reason ? ` · <span class="log-reason">${escapeHtml(g.reason)}</span>` : ""}</div>
            <button class="grant-del" data-id="${g.id}">삭제</button>
          </div>`;
          }).join("")
        : `<div class="empty-mini">등록된 대체휴가 발생 내역이 없습니다.</div>`;

      // 통계 카드 클릭 시 보여줄 상세 목록
      const todayStr = todayLocalStr();
      const statGroups = {
        total: computed,
        a: computed.filter((c) => c.statusKey === "a"),
        b: computed.filter((c) => c.statusKey === "b"),
      };
      const statLabels = { total: "전체 등록 인원", a: "입사연도(비례연차 대기)", b: "정상 편입" };
      let breakdownHtml = "";
      if (selectedStat && statGroups[selectedStat]) {
        const list = statGroups[selectedStat];
        breakdownHtml = `
        <div class="card breakdown-card">
          <h2>${statLabels[selectedStat]} 상세 <span class="count-badge">${list.length}명</span> <button class="breakdown-close" id="breakdown-close">닫기 ✕</button></h2>
          ${list.length ? list.map((c) => `
            <div class="upcoming-item">
              <div><div class="name">${escapeHtml(c.name)}</div><div class="meta">${c.detail}</div></div>
              <span class="status-pill status-${c.statusKey}">${c.statusLabel}</span>
            </div>`).join("") : `<div class="empty-mini">해당하는 직원이 없습니다.</div>`}
        </div>`;
      }

      // 전체 페이지 요약: 오늘 휴가, 이번주 예정, 최근 등록 내역(사용+발생 통합)
      // 연속 휴가(예: 금요일부터 2일)를 주말을 제외한 실제 날짜들로 펼쳐서 하루 단위로 관리
      const expandedLeaveEntries = [];
      leaveLog.forEach((l) => {
        expandToBusinessDays(l.date, l.days).forEach((sp) => {
          expandedLeaveEntries.push({ ...l, date: sp.date, days: sp.portion, spanStart: l.date, emp: roster.find((r) => r.id === l.empId) });
        });
      });

      const todayOffList = expandedLeaveEntries.filter((l) => l.date === todayStr);
      const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate() + 7);
      const weekList = expandedLeaveEntries
        .filter((l) => { const d = parseDate(l.date); return d > today && d <= weekEnd; })
        .sort((a, b) => (a.date < b.date ? -1 : 1));
      const recentActivity = [
        ...leaveLog.map((l) => ({ ...l, kind: l.type })),
        ...grantLog.map((g) => ({ ...g, kind: "grant" })),
      ].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 6);

      const kindLabel = { annual: "연차 사용", comp: "대체휴가 사용", grant: "대체휴가 발생" };
      const kindClass = { annual: "annual", comp: "comp", grant: "comp" };

      const todayOffHtml = todayOffList.length
        ? todayOffList.map((l) => `<span class="cal-chip ${l.type}" style="display:inline-block;margin:0 4px 4px 0;">${escapeHtml(l.emp ? l.emp.name : "?")} · ${l.type === "annual" ? "연차" : "대체휴가"}</span>`).join("")
        : `<div class="empty-mini">오늘 휴가/대체휴가 사용자가 없습니다.</div>`;

      const weekHtml = weekList.length
        ? weekList.map((l) => {
            const emp = l.emp;
            return `<div class="upcoming-item"><div><div class="name">${escapeHtml(emp ? emp.name : "?")}</div><div class="meta">${l.date} · ${l.type === "annual" ? "연차" : "대체휴가"} ${l.days}일${l.reason ? " · " + escapeHtml(l.reason) : ""}</div></div></div>`;
          }).join("")
        : `<div class="empty-mini">앞으로 7일 이내 예정된 휴가가 없습니다.</div>`;

      const recentActivityHtml = recentActivity.length
        ? recentActivity.map((item) => {
            const emp = roster.find((r) => r.id === item.empId);
            return `<div class="log-item"><div><span class="log-type ${kindClass[item.kind]}">${kindLabel[item.kind]}</span>${escapeHtml(emp ? emp.name : "(삭제됨)")} · ${item.date} · ${item.days}일${item.reason ? ` · <span class="log-reason">${escapeHtml(item.reason)}</span>` : ""}</div></div>`;
          }).join("")
        : `<div class="empty-mini">등록된 활동 내역이 없습니다.</div>`;


      // 캘린더
      const y = calMonth.getFullYear(), m = calMonth.getMonth();
      const firstDow = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const logsByDate = {};
      expandedLeaveEntries.forEach((l) => { (logsByDate[l.date] = logsByDate[l.date] || []).push(l); });

      let calCells = "";
      for (let i = 0; i < firstDow; i++) calCells += `<div class="cal-cell empty"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const entries = logsByDate[dStr] || [];
        const shown = entries.slice(0, 3);
        const chips = shown.map((l) => {
          const emp = roster.find((r) => r.id === l.empId);
          return `<span class="cal-chip ${l.type}">${escapeHtml(emp ? emp.name : "?")}</span>`;
        }).join("");
        const more = entries.length > 3 ? `<span class="cal-more">+${entries.length - 3}명</span>` : "";
        calCells += `<div class="cal-cell ${dStr === todayStr ? "today" : ""}"><div class="cal-daynum">${day}</div>${chips}${more}</div>`;
      }

      // 전자결재 문서 업로드 미리보기
      const rawTextViewer = docRawText
        ? `<details style="margin-top:12px;"><summary style="cursor:pointer; font-size:12px; color:var(--navy); font-weight:700;">🔍 인식된 원문 보기 (인식이 틀렸을 때 이 내용을 캡처해서 공유해주세요)</summary>
            <pre style="white-space:pre-wrap; font-size:11px; color:var(--gray); background:var(--cream); padding:10px; border-radius:8px; margin-top:8px; max-height:220px; overflow:auto;">${escapeHtml(docRawText)}</pre>
          </details>`
        : "";
      let docPreviewHtml = "";
      if (docParseError) {
        docPreviewHtml = `<div class="card" style="margin-bottom:16px;"><div class="empty-mini" style="color:var(--red);">⚠ ${escapeHtml(docParseError)}</div>${rawTextViewer}</div>`;
      } else if (docStatusMessage) {
        docPreviewHtml = `<div class="card" style="margin-bottom:16px;"><div class="empty-mini" style="color:var(--teal); font-weight:700;">✓ ${escapeHtml(docStatusMessage)}</div></div>`;
      } else if (docPreviewRows && docPreviewRows.length) {
        const seenInBatch = {};
        docPreviewHtml = `
        <div class="card" style="margin-bottom:16px;">
          <h2>업로드 내용 확인 <span class="count-badge">${docPreviewRows.length}건 인식됨</span></h2>
          <div class="table-scroll">
            <table style="min-width:800px;">
              <thead><tr><th>직원</th><th>날짜</th><th>유형</th><th>일수</th><th>사유</th><th></th></tr></thead>
              <tbody>
                ${docPreviewRows.map((r, i) => {
                  const matched = roster.find((emp) => emp.name === r.name);
                  const [dy, dm, dd] = (r.date || "").split("-");
                  const empId = matched ? matched.id : "";
                  const dupKey = empId + "|" + r.date;
                  const existsInLog = empId && leaveLog.some((l) => l.empId === empId && l.date === r.date);
                  const dupInBatch = empId && seenInBatch[dupKey];
                  if (empId) seenInBatch[dupKey] = true;
                  const isDup = existsInLog || dupInBatch;
                  const warnText = existsInLog ? "⚠ 이미 등록된 날짜와 중복" : dupInBatch ? "⚠ 업로드 파일 내에서 중복" : "";
                  return `
                  <tr class="doc-preview-row ${isDup ? "dup-row" : ""}" data-idx="${i}">
                    <td>
                      <select class="dp-emp">${empOptionsWithSelected(matched ? matched.id : "", r.name)}</select>
                      ${warnText ? `<div class="dup-warning">${warnText}</div>` : ""}
                    </td>
                    <td>${dateGroupHtml("dp-date", dy, dm, dd)}</td>
                    <td><select class="dp-type"><option value="annual" ${r.type === "annual" ? "selected" : ""}>연차</option><option value="comp" ${r.type === "comp" ? "selected" : ""}>대체휴가</option></select></td>
                    <td><input type="number" class="dp-days" min="0.5" step="0.5" value="${r.days}" style="width:64px;" /></td>
                    <td><input type="text" class="dp-reason" value="${escapeHtml(r.reason)}" style="width:160px;" /></td>
                    <td><button class="dp-remove" data-idx="${i}">제외</button></td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
          <div style="display:flex; gap:8px; margin-top:14px;">
            <button class="btn secondary" id="doc-confirm-btn" style="width:auto;">전체 등록</button>
            <button class="cancel-btn" id="doc-discard-btn" style="padding:10px 16px;">취소</button>
          </div>
          ${rawTextViewer}
          <div class="footnote" style="margin:14px 0 0; padding-top:10px;">
            ※ 자동 인식은 참고용입니다. 이름이 매칭되지 않았거나 날짜·일수가 잘못 읽힌 경우 직접 수정한 뒤 등록해주세요.
          </div>
        </div>`;
      }

      // 퇴사자 정산 계산 및 업로드 미리보기
      const resignSettlement = resignActive ? computeResignSettlement(resignActive) : null;
      const resignUsageHtml = resignActive && resignActive.usageLog.length
        ? resignActive.usageLog.map((u, i) => `
          <div class="log-item">
            <div><span class="log-type ${u.type}">${u.type === "annual" ? "연차" : "대체휴가"}</span>${u.date} · ${u.days}일${u.reason ? ` · <span class="log-reason">${escapeHtml(u.reason)}</span>` : ""}</div>
            <button class="resign-usage-del" data-idx="${i}">삭제</button>
          </div>`).join("")
        : `<div class="empty-mini">등록된 사용 내역이 없습니다.</div>`;

      const resignRawTextViewer = resignDocRawText
        ? `<details style="margin-top:8px;"><summary style="cursor:pointer; font-size:12px; color:var(--navy); font-weight:700;">🔍 인식된 원문 보기</summary>
            <pre style="white-space:pre-wrap; font-size:11px; color:var(--gray); background:var(--cream); padding:10px; border-radius:8px; margin-top:8px; max-height:220px; overflow:auto;">${escapeHtml(resignDocRawText)}</pre>
          </details>`
        : "";
      let resignDocPreviewHtml = "";
      if (resignDocParseError) {
        resignDocPreviewHtml = `<div class="empty-mini" style="color:var(--red); margin-top:10px;">⚠ ${escapeHtml(resignDocParseError)}</div>${resignRawTextViewer}`;
      } else if (resignDocPreviewRows && resignDocPreviewRows.length) {
        resignDocPreviewHtml = `
        <div class="table-scroll" style="margin-top:12px;">
          <table style="min-width:600px;">
            <thead><tr><th>날짜</th><th>유형</th><th>일수</th><th>사유</th><th></th></tr></thead>
            <tbody>
              ${resignDocPreviewRows.map((r, i) => {
                const [dy, dm, dd] = (r.date || "").split("-");
                return `
                <tr class="resign-doc-row" data-idx="${i}">
                  <td>${dateGroupHtml("rdp-date", dy, dm, dd)}</td>
                  <td><select class="rdp-type"><option value="annual" ${r.type === "annual" ? "selected" : ""}>연차</option><option value="comp" ${r.type === "comp" ? "selected" : ""}>대체휴가</option></select></td>
                  <td><input type="number" class="rdp-days" min="0.5" step="0.5" value="${r.days}" style="width:64px;" /></td>
                  <td><input type="text" class="rdp-reason" value="${escapeHtml(r.reason)}" style="width:140px;" /></td>
                  <td><button class="rdp-remove" data-idx="${i}">제외</button></td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        <button class="btn secondary" id="resign-doc-confirm-btn" style="width:auto; margin-top:10px;">이 내역들 추가</button>
        <button class="cancel-btn" id="resign-doc-discard-btn" style="padding:9px 14px; margin-top:10px;">취소</button>
        <div style="margin-top:8px;">${resignRawTextViewer}</div>`;
      }

      const resignListHtml = resignations.length
        ? resignations.map((r) => {
            const s = computeResignSettlement(r);
            return `
          <div class="log-item" style="align-items:flex-start;">
            <div>
              <div class="name">${escapeHtml(r.name || "(이름없음)")}</div>
              <div class="meta">${r.hireDate} ~ ${r.resignDate} · 발생 ${s.grantedAnnual}일(${s.chosen === "A" ? "입사일기준" : "회계연도기준"}) · 연차잔여 ${s.remainingAnnual}일(촉진면제 ${s.promotedDays}일 → 지급대상 ${s.payableAnnual}일) · 대체휴가잔여 ${s.remainingComp}일</div>
            </div>
            <button class="resign-del" data-id="${r.id}">삭제</button>
          </div>`;
          }).join("")
        : `<div class="empty-mini">저장된 퇴사자 정산 내역이 없습니다.</div>`;

      const pages = {
        home: `
        <div class="stat-grid">
          <div class="stat-card accent-total clickable" data-stat="total"><div class="n">${computed.length}</div><div class="l">전체 등록 인원</div></div>
          <div class="stat-card accent-a clickable" data-stat="a"><div class="n">${countA}</div><div class="l">입사연도(비례연차 대기)</div></div>
          <div class="stat-card accent-b clickable" data-stat="b"><div class="n">${countB}</div><div class="l">정상 편입</div></div>
        </div>
        ${breakdownHtml}
        <div class="card">
          <h2>다가오는 비례연차 지급 예정 <span class="count-badge">90일 이내 ${upcoming.length}명</span></h2>
          ${upcomingHtml}

      const calPrevBtn = document.getElementById("cal-prev");
      const calNextBtn = document.getElementById("cal-next");
      if (calPrevBtn) calPrevBtn.onclick = () => { calMonth = new Date(y, m - 1, 1); paint(); };
      if (calNextBtn) calNextBtn.onclick = () => { calMonth = new Date(y, m + 1, 1); paint(); };

      root.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.onclick = () => { currentPage = btn.getAttribute("data-page"); paint(); };
      });

      root.querySelectorAll(".stat-card.clickable").forEach((card) => {
        card.onclick = () => {
          const key = card.getAttribute("data-stat");
          selectedStat = selectedStat === key ? null : key;
          paint();
        };
      });
      const breakdownCloseBtn = document.getElementById("breakdown-close");
      if (breakdownCloseBtn) breakdownCloseBtn.onclick = (e) => { e.stopPropagation(); selectedStat = null; paint(); };

      const docParseBtn = document.getElementById("doc-parse-btn");
      if (docParseBtn) docParseBtn.onclick = async () => {
        const fileInput = document.getElementById("doc-upload");
        const file = fileInput.files && fileInput.files[0];
        if (!file) { alert("파일을 먼저 선택해주세요."); return; }
        docParseError = null; docStatusMessage = null;
        docParseBtn.textContent = "분석 중…";
        docParseBtn.disabled = true;
        try {
          const isPdf = /\.pdf$/i.test(file.name);
          const result = isPdf ? await parsePdfFile(file) : await parseExcelFile(file);
          const rows = result.rows;
          docRawText = result.rawText;
          const valid = rows.filter((r) => r.date);
          if (!valid.length) {
            docParseError = "파일에서 날짜·직원 정보를 인식하지 못했습니다. 아래 '인식된 원문 보기'를 확인해주세요.";
            docPreviewRows = null;
          } else {
            docPreviewRows = valid;
          }
        } catch (e) {
          console.error(e);
          docParseError = "파일을 분석하는 중 오류가 발생했습니다: " + e.message;
          docPreviewRows = null;
        }
        paint();
      };

      const docDiscardBtn = document.getElementById("doc-discard-btn");
      if (docDiscardBtn) docDiscardBtn.onclick = () => { docPreviewRows = null; docParseError = null; docStatusMessage = null; paint(); };

      root.querySelectorAll(".dp-remove").forEach((btn) => {
        btn.onclick = () => {
          const idx = Number(btn.getAttribute("data-idx"));
          docPreviewRows.splice(idx, 1);
          if (!docPreviewRows.length) docPreviewRows = null;
          paint();
        };
      });

      // 미리보기 행의 직원/날짜를 수정할 때마다 중복 표시를 실시간으로 갱신
      function getPreviewRowsLive() {
        return Array.from(root.querySelectorAll(".doc-preview-row")).map((rowEl) => ({
          rowEl,
          empId: rowEl.querySelector(".dp-emp").value,
          date: getDateGroupValue(rowEl.querySelector(".date-group.dp-date")),
        }));
      }
      function flagDuplicates(rowsLive) {
        const seen = {};
        return rowsLive.map((r) => {
          if (!r.empId || !r.date) return { ...r, isDup: false, dupReason: "" };
          const key = r.empId + "|" + r.date;
          const existsInLog = leaveLog.some((l) => l.empId === r.empId && l.date === r.date);
          const dupInBatch = seen[key];
          seen[key] = true;
          if (existsInLog) return { ...r, isDup: true, dupReason: "⚠ 이미 등록된 날짜와 중복" };
          if (dupInBatch) return { ...r, isDup: true, dupReason: "⚠ 업로드 파일 내에서 중복" };
          return { ...r, isDup: false, dupReason: "" };
        });
      }
      function recomputeDocDupWarnings() {
        flagDuplicates(getPreviewRowsLive()).forEach(({ rowEl, isDup, dupReason }) => {
          rowEl.classList.toggle("dup-row", isDup);
          let warnEl = rowEl.querySelector(".dup-warning");
          if (isDup) {
            if (!warnEl) {
              warnEl = document.createElement("div");
              warnEl.className = "dup-warning";
              rowEl.querySelector(".dp-emp").insertAdjacentElement("afterend", warnEl);
            }
            warnEl.textContent = dupReason;
          } else if (warnEl) {
            warnEl.remove();
          }
        });
      }
      root.querySelectorAll(".doc-preview-row").forEach((rowEl) => {
        rowEl.querySelector(".dp-emp").addEventListener("change", recomputeDocDupWarnings);
        rowEl.querySelectorAll(".date-group.dp-date input").forEach((inp) => {
          inp.addEventListener("input", recomputeDocDupWarnings);
        });
      });

      const docConfirmBtn = document.getElementById("doc-confirm-btn");
      if (docConfirmBtn) docConfirmBtn.onclick = () => {
        const rowEls = root.querySelectorAll(".doc-preview-row");
        // 1) 현재 화면에 입력된 값 기준으로 등록 후보를 모두 수집
        const candidates = [];
        rowEls.forEach((rowEl) => {
          const empId = rowEl.querySelector(".dp-emp").value;
          const date = getDateGroupValue(rowEl.querySelector(".date-group.dp-date"));
          const type = rowEl.querySelector(".dp-type").value;
          const days = Number(rowEl.querySelector(".dp-days").value) || 0;
          const reason = rowEl.querySelector(".dp-reason").value.trim();
          if (empId && date && days > 0) candidates.push({ empId, date, type, days, reason });
        });
        const skippedNoEmp = rowEls.length - candidates.length;

        // 2) 기존 등록 내역 및 업로드 항목 내부의 중복(동일 직원+동일 날짜)을 판별
        const seen = {};
        const toAdd = [];
        let dupCount = 0;
        candidates.forEach((c) => {
          const key = c.empId + "|" + c.date;
          const existsInLog = leaveLog.some((l) => l.empId === c.empId && l.date === c.date);
          const dupInBatch = seen[key];
          seen[key] = true;
          if (existsInLog || dupInBatch) {
            dupCount++;
          } else {
            toAdd.push(c);
          }
        });

        // 3) 중복이 있으면 팝업으로 안내하고, 확인 시 중복분만 제외하고 등록
        if (dupCount > 0) {
          const proceed = confirm(
            `⚠ 중복 등록 경고\n\n${dupCount}건이 이미 등록된 날짜(또는 업로드 파일 내에서 같은 직원·같은 날짜)와 중복됩니다.\n` +
            `중복된 항목은 표에서 빨간색으로 표시되어 있습니다.\n\n` +
            `중복 항목을 제외하고 나머지 ${toAdd.length}건만 등록할까요?\n("취소"를 누르면 아무것도 등록되지 않으니, 표에서 직접 수정 후 다시 시도해주세요)`
          );
          if (!proceed) return;
        }

        toAdd.forEach((c) => leaveLog.push({ id: genId(), ...c }));
        if (toAdd.length) saveLog();

        docPreviewRows = null;
        const messages = [];
        if (toAdd.length) messages.push(`${toAdd.length}건 등록됨`);
        if (dupCount) messages.push(`중복 ${dupCount}건 제외`);
        if (skippedNoEmp) messages.push(`직원 미지정 ${skippedNoEmp}건 제외`);
        docStatusMessage = messages.length ? messages.join(" · ") : "등록된 항목이 없습니다.";
        paint();
      };

      // ---- 퇴사자 정산 핸들러 ----
      const resignStartBtn = document.getElementById("resign-start-btn");
      if (resignStartBtn) resignStartBtn.onclick = () => {
        const name = document.getElementById("resign-name").value.trim();
        const hireDate = getDateGroupValue(root.querySelector(".date-group.resign-hire"));
        const resignDate = getDateGroupValue(root.querySelector(".date-group.resign-date"));
        const comp = Number(document.getElementById("resign-comp").value) || 0;
        if (!hireDate) { root.querySelector(".date-group.resign-hire .dg-y").focus(); return; }
        if (!resignDate) { root.querySelector(".date-group.resign-date .dg-y").focus(); return; }
        if (parseDate(resignDate) <= parseDate(hireDate)) { alert("퇴사일은 입사일보다 이후여야 합니다."); return; }
        resignActive = { name, hireDate, resignDate, compGranted: comp, promotedDaysOverride: null, usageLog: [] };
        paint();
      };

      const resignLogAddBtn = document.getElementById("resign-log-add-btn");
      if (resignLogAddBtn) resignLogAddBtn.onclick = () => {
        const dateGroup = root.querySelector(".date-group.resign-log-date");
        const date = getDateGroupValue(dateGroup);
        const type = document.getElementById("resign-log-type").value;
        const days = Number(document.getElementById("resign-log-days").value) || 0;
        const reason = document.getElementById("resign-log-reason").value.trim();
        if (!date) { dateGroup.querySelector(".dg-y").focus(); return; }
        if (days <= 0) { alert("사용 일수를 입력해주세요."); return; }
        resignActive.usageLog.push({ date, type, days, reason });
        paint();
      };

      root.querySelectorAll(".resign-usage-del").forEach((btn) => {
        btn.onclick = () => {
          const idx = Number(btn.getAttribute("data-idx"));
          resignActive.usageLog.splice(idx, 1);
          paint();
        };
      });

      const resignPromotedInput = document.getElementById("resign-promoted");
      if (resignPromotedInput) resignPromotedInput.addEventListener("change", () => {
        resignActive.promotedDaysOverride = Number(resignPromotedInput.value) || 0;
        paint();
      });

      const resignDocParseBtn = document.getElementById("resign-doc-parse-btn");
      if (resignDocParseBtn) resignDocParseBtn.onclick = async () => {
        const fileInput = document.getElementById("resign-doc-upload");
        const file = fileInput.files && fileInput.files[0];
        if (!file) { alert("파일을 먼저 선택해주세요."); return; }
        resignDocParseError = null;
        resignDocParseBtn.textContent = "분석 중…";
        resignDocParseBtn.disabled = true;
        try {
          const isPdf = /\.pdf$/i.test(file.name);
          const result = isPdf ? await parsePdfFile(file) : await parseExcelFile(file);
          resignDocRawText = result.rawText;
          const valid = result.rows.filter((r) => r.date);
          if (!valid.length) {
            resignDocParseError = "파일에서 날짜 정보를 인식하지 못했습니다. 아래 '인식된 원문 보기'를 확인해주세요.";
            resignDocPreviewRows = null;
          } else {
            resignDocPreviewRows = valid;
          }
        } catch (e) {
          console.error(e);
          resignDocParseError = "파일을 분석하는 중 오류가 발생했습니다: " + e.message;
          resignDocPreviewRows = null;
        }
        paint();
      };

      const resignDocDiscardBtn = document.getElementById("resign-doc-discard-btn");
      if (resignDocDiscardBtn) resignDocDiscardBtn.onclick = () => { resignDocPreviewRows = null; resignDocParseError = null; resignDocRawText = null; paint(); };

      root.querySelectorAll(".rdp-remove").forEach((btn) => {
        btn.onclick = () => {
          const idx = Number(btn.getAttribute("data-idx"));
          resignDocPreviewRows.splice(idx, 1);
          if (!resignDocPreviewRows.length) resignDocPreviewRows = null;
          paint();
        };
      });

      const resignDocConfirmBtn = document.getElementById("resign-doc-confirm-btn");
      if (resignDocConfirmBtn) resignDocConfirmBtn.onclick = () => {
        const rowEls = root.querySelectorAll(".resign-doc-row");
        rowEls.forEach((rowEl) => {
          const date = getDateGroupValue(rowEl.querySelector(".date-group.rdp-date"));
          const type = rowEl.querySelector(".rdp-type").value;
          const days = Number(rowEl.querySelector(".rdp-days").value) || 0;
          const reason = rowEl.querySelector(".rdp-reason").value.trim();
          if (date && days > 0) resignActive.usageLog.push({ date, type, days, reason });
        });
        resignDocPreviewRows = null;
        paint();
      };

      const resignSaveBtn = document.getElementById("resign-save-btn");
      if (resignSaveBtn) resignSaveBtn.onclick = () => {
        resignations.push({ id: genId(), ...resignActive });
        saveResign();
        resignActive = null;
        paint();
      };
      const resignCancelBtn = document.getElementById("resign-cancel-btn");
      if (resignCancelBtn) resignCancelBtn.onclick = () => {
        if (confirm("작성 중인 정산 내용이 사라집니다. 취소하시겠습니까?")) { resignActive = null; paint(); }
      };
      root.querySelectorAll(".resign-del").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-id");
          resignations = resignations.filter((r) => r.id !== id);
          saveResign();
          paint();
        };
      });

      root.querySelectorAll(".date-group").forEach(wireDateGroup);
    }

    load();
  }

  render();
})();
</script>
</body>
</html>

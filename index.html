<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>연차 관리 대시보드 · 크림웨이브</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body style="margin:0; background:#F7F5F0;">
<div id="leave-app"></div>
<style>
#leave-app {
  --navy: #1F3864;
  --navy-deep: #142845;
  --cream: #F7F5F0;
  --paper: #FFFFFF;
  --line: #E3DFD6;
  --teal: #2F6F62;
  --teal-bg: #E8F1EE;
  --amber: #B5791F;
  --amber-bg: #FAF0DF;
  --violet: #5B3E9E;
  --violet-bg: #EAE6F5;
  --gray: #6B6B66;
  --ink: #26241F;
  --red: #B33B3B;
  font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif;
  color: var(--ink);
  background: var(--cream);
  padding: 26px 24px 40px;
  border-radius: 14px;
  max-width: 1180px;
  margin: 0 auto;
  box-sizing: border-box;
}
#leave-app * { box-sizing: border-box; }
#leave-app .top-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
#leave-app .eyebrow { font-size: 12px; letter-spacing: 0.14em; color: var(--navy); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
#leave-app h1 { font-size: 25px; margin: 0 0 4px; color: var(--navy-deep); letter-spacing: -0.01em; font-weight: 800; }
#leave-app .sub { color: var(--gray); font-size: 13.5px; margin: 0; line-height: 1.5; }
#leave-app .top-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
#leave-app .sync-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
#leave-app .sync-badge.on { background: var(--teal-bg); color: var(--teal); }
#leave-app .sync-badge.off { background: var(--line); color: var(--gray); }
#leave-app .today-box { background: var(--navy); color: white; border-radius: 12px; padding: 12px 18px; text-align: right; min-width: 220px; }
#leave-app .today-box .label { font-size: 11px; opacity: 0.75; margin-bottom: 3px; }
#leave-app .today-box .date { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
#leave-app .today-box .live { font-size: 10.5px; opacity: 0.8; margin-top: 3px; }
#leave-app .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6FE3A0; margin-right: 5px; animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
#leave-app .xlsx-btn { background: var(--teal); color: white; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
#leave-app .xlsx-btn:hover { opacity: 0.88; }

#leave-app .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
#leave-app .stat-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px; }
#leave-app .stat-card .n { font-size: 26px; font-weight: 800; color: var(--navy-deep); font-variant-numeric: tabular-nums; }
#leave-app .stat-card .l { font-size: 12px; color: var(--gray); margin-top: 2px; font-weight: 600; }
#leave-app .stat-card.accent-a { border-top: 3px solid var(--amber); }
#leave-app .stat-card.accent-b { border-top: 3px solid var(--teal); }
#leave-app .stat-card.accent-c { border-top: 3px solid var(--violet); }
#leave-app .stat-card.accent-total { border-top: 3px solid var(--navy); }
#leave-app .stat-card.accent-comp { border-top: 3px solid #9C6B1F; }

#leave-app .grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-bottom: 16px; align-items: start; }
#leave-app .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
#leave-app .card h2 { font-size: 14.5px; margin: 0 0 12px; color: var(--navy-deep); font-weight: 700; display: flex; align-items: center; gap: 8px; }
#leave-app .upcoming-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
#leave-app .upcoming-item:last-child { border-bottom: none; }
#leave-app .upcoming-item .name { font-weight: 700; color: var(--ink); }
#leave-app .upcoming-item .meta { color: var(--gray); font-size: 11.5px; margin-top: 1px; }
#leave-app .dday { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--violet-bg); color: var(--violet); white-space: nowrap; }
#leave-app .dday.urgent { background: var(--amber-bg); color: var(--amber); }
#leave-app .empty-mini { color: var(--gray); font-size: 12.5px; padding: 10px 0; }

#leave-app .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#leave-app .form-grid .full { grid-column: 1 / -1; }
#leave-app label { display: block; font-size: 12px; color: var(--gray); margin-bottom: 5px; font-weight: 600; }
#leave-app input, #leave-app select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; font-family: inherit; background: var(--cream); color: var(--ink);
}
#leave-app input:focus, #leave-app select:focus { outline: 2px solid var(--navy); outline-offset: 1px; background: var(--paper); }
#leave-app .date-group { display: flex; align-items: center; gap: 4px; }
#leave-app .date-group .dg-y { width: 62px; text-align: center; flex: none; }
#leave-app .date-group .dg-m, #leave-app .date-group .dg-d { width: 40px; text-align: center; flex: none; }
#leave-app .date-group .dg-sep { color: var(--gray); font-weight: 600; }
#leave-app td .date-group { display: inline-flex; }
#leave-app .btn { background: var(--navy); color: white; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 4px; }
#leave-app .btn:hover { background: var(--navy-deep); }
#leave-app .btn.secondary { background: var(--teal); }

#leave-app .log-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
#leave-app .log-item:last-child { border-bottom: none; }
#leave-app .log-type { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
#leave-app .log-type.annual { background: var(--teal-bg); color: var(--teal); }
#leave-app .log-type.comp { background: var(--violet-bg); color: var(--violet); }
#leave-app .log-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 11.5px; font-weight: 700; }
#leave-app .log-del:hover { text-decoration: underline; }

#leave-app .cal-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
#leave-app .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
#leave-app .cal-nav { display: flex; gap: 8px; align-items: center; }
#leave-app .cal-nav button { background: var(--cream); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--navy-deep); }
#leave-app .cal-nav button:hover { background: var(--line); }
#leave-app .cal-title { font-size: 15px; font-weight: 800; color: var(--navy-deep); min-width: 110px; text-align: center; }
#leave-app .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
#leave-app .cal-dow { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--gray); padding-bottom: 4px; }
#leave-app .cal-cell { min-height: 74px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--cream); }
#leave-app .cal-cell.empty { background: transparent; border: none; }
#leave-app .cal-cell.today { border: 2px solid var(--navy); background: var(--paper); }
#leave-app .cal-daynum { font-size: 12px; font-weight: 700; color: var(--gray); margin-bottom: 4px; }
#leave-app .cal-chip { display: block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#leave-app .cal-chip.annual { background: var(--teal-bg); color: var(--teal); }
#leave-app .cal-chip.comp { background: var(--violet-bg); color: var(--violet); }
#leave-app .cal-more { font-size: 10px; color: var(--gray); }

#leave-app .table-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#leave-app .table-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; }
#leave-app .table-scroll { overflow-x: auto; }
#leave-app table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; min-width: 1100px; }
#leave-app th { text-align: left; background: var(--navy); color: white; padding: 10px 12px; font-weight: 700; font-size: 11.5px; white-space: nowrap; }
#leave-app td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
#leave-app tbody tr:hover { background: #FBFAF7; }
#leave-app tr:last-child td { border-bottom: none; }
#leave-app .status-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
#leave-app .status-a { background: var(--amber-bg); color: var(--amber); }
#leave-app .status-b { background: var(--teal-bg); color: var(--teal); }
#leave-app .status-c { background: var(--violet-bg); color: var(--violet); }
#leave-app .num { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--navy-deep); white-space: nowrap; }
#leave-app .detail { color: var(--gray); font-size: 11.5px; line-height: 1.5; max-width: 220px; }
#leave-app .del-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 12px; font-weight: 700; padding: 4px 6px; }
#leave-app .del-btn:hover { text-decoration: underline; }
#leave-app .edit-btn { background: none; border: none; color: var(--navy); cursor: pointer; font-size: 12px; font-weight: 700; padding: 4px 6px; }
#leave-app .edit-btn:hover { text-decoration: underline; }
#leave-app .save-btn { background: var(--teal); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; padding: 5px 10px; margin-right: 4px; }
#leave-app .save-btn:hover { opacity: 0.85; }
#leave-app .cancel-btn { background: var(--line); color: var(--ink); border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; padding: 5px 10px; }
#leave-app .cancel-btn:hover { opacity: 0.85; }
#leave-app .editing-row { background: #FBF8EF; }
#leave-app .editing-row input { padding: 6px 8px; font-size: 13px; }
#leave-app .empty { text-align: center; color: var(--gray); padding: 34px 10px; font-size: 13.5px; }
#leave-app .footnote { margin: 16px 20px 20px; font-size: 11.5px; color: var(--gray); line-height: 1.6; border-top: 1px dashed var(--line); padding-top: 12px; }
#leave-app .loading-msg { padding: 40px; text-align: center; color: var(--gray); font-size: 13px; }
#leave-app .count-badge { background: var(--cream); color: var(--navy-deep); font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
@media (max-width: 760px) {
  #leave-app .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #leave-app .grid-2 { grid-template-columns: 1fr; }
  #leave-app .form-grid { grid-template-columns: 1fr; }
  #leave-app .cal-cell { min-height: 56px; }
}
</style>
<script>
(function () {
  const ROSTER_KEY_V1 = "leave-roster-v1";
  const ROSTER_KEY = "leave-roster-v2";
  const LOG_KEY = "leave-log-v1";
  let refreshTimer = null;
  let lastDateStr = null;

  const firebaseConfig = {
    apiKey: "AIzaSyA8md-PNEENeEkAJzxJwl3j3kifbuE9nZk",
    authDomain: "leavedashboard.firebaseapp.com",
    databaseURL: "https://leavedashboard-default-rtdb.firebaseio.com",
    projectId: "leavedashboard",
    storageBucket: "leavedashboard.firebasestorage.app",
    messagingSenderId: "875914038690",
    appId: "1:875914038690:web:39ca1a2ba54c35c277f6fb",
  };

  let fbDb = null;
  try {
    if (typeof firebase !== "undefined") {
      firebase.initializeApp(firebaseConfig);
      fbDb = firebase.database();
    }
  } catch (e) {
    console.error("Firebase 초기화 실패, 로컬 저장 모드로 전환:", e);
    fbDb = null;
  }

  function arrToObj(arr) { const o = {}; (arr || []).forEach((item) => { o[item.id] = item; }); return o; }
  function objToArr(obj) { return obj ? Object.keys(obj).map((k) => ({ ...obj[k], id: k })) : []; }

  function genId() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function fmt(d) { return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`; }
  function fmtWeekday(d) { const w = ["일","월","화","수","목","금","토"][d.getDay()]; return `${fmt(d)} (${w})`; }
  function addYears(d, n) { return new Date(d.getFullYear() + n, d.getMonth(), d.getDate()); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function fullMonthsBetween(a, b) { let months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); if (b.getDate() < a.getDate()) months--; return Math.max(0, months); }
  function fullYearsBetween(a, b) { let years = b.getFullYear() - a.getFullYear(); const anniv = new Date(a.getFullYear() + years, a.getMonth(), a.getDate()); if (anniv > b) years--; return Math.max(0, years); }
  function round1(n) { return Math.round(n * 10) / 10; }
  function annualFormula(serviceYears) { return Math.min(25, 15 + Math.floor((serviceYears - 1) / 2)); }
  function todayLocalStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function dateGroupHtml(extraClass, y, m, d) {
    return `<div class="date-group ${extraClass || ""}">
      <input type="text" inputmode="numeric" maxlength="4" class="dg-y" placeholder="YYYY" value="${y || ""}" />
      <span class="dg-sep">-</span>
      <input type="text" inputmode="numeric" maxlength="2" class="dg-m" placeholder="MM" value="${m || ""}" />
      <span class="dg-sep">-</span>
      <input type="text" inputmode="numeric" maxlength="2" class="dg-d" placeholder="DD" value="${d || ""}" />
    </div>`;
  }
  function wireDateGroup(groupEl) {
    if (!groupEl) return;
    const y = groupEl.querySelector(".dg-y"), m = groupEl.querySelector(".dg-m"), d = groupEl.querySelector(".dg-d");
    y.addEventListener("input", () => { y.value = y.value.replace(/\D/g, "").slice(0, 4); if (y.value.length === 4) m.focus(); });
    m.addEventListener("input", () => { m.value = m.value.replace(/\D/g, "").slice(0, 2); if (m.value.length === 2) d.focus(); });
    d.addEventListener("input", () => { d.value = d.value.replace(/\D/g, "").slice(0, 2); });
    m.addEventListener("keydown", (e) => { if (e.key === "Backspace" && m.value === "") y.focus(); });
    d.addEventListener("keydown", (e) => { if (e.key === "Backspace" && d.value === "") m.focus(); });
    [y, m, d].forEach((el) => el.addEventListener("blur", () => {
      if (m.value && m.value.length === 1) m.value = m.value.padStart(2, "0");
      if (d.value && d.value.length === 1) d.value = d.value.padStart(2, "0");
    }));
  }
  function getDateGroupValue(groupEl) {
    if (!groupEl) return null;
    const y = groupEl.querySelector(".dg-y").value;
    let m = groupEl.querySelector(".dg-m").value, d = groupEl.querySelector(".dg-d").value;
    if (y.length !== 4 || !m || !d) return null;
    m = m.padStart(2, "0"); d = d.padStart(2, "0");
    if (Number(m) < 1 || Number(m) > 12 || Number(d) < 1 || Number(d) > 31) return null;
    return `${y}-${m}-${d}`;
  }

  function calcLeave(hireDate, baseDate) {
    const anniversary1 = addYears(hireDate, 1);
    const jan1ThisYear = new Date(baseDate.getFullYear(), 0, 1);
    if (anniversary1 > baseDate) {
      const monthsWorked = fullMonthsBetween(hireDate, baseDate);
      const monthlyLeave = Math.min(11, monthsWorked);
      const hireYearEnd = new Date(hireDate.getFullYear(), 11, 31);
      const daysInHireYear = daysBetween(hireDate, hireYearEnd) + 1;
      const proRated = round1((15 * daysInHireYear) / 365);
      return { statusKey: "a", statusLabel: "입사 1년 미만", granted: monthlyLeave, anniversary: anniversary1, proRated,
        detail: `개근 가정 시 월차 ${monthlyLeave}일 발생(최대 11일) · 비례연차 ${proRated}일은 1주년(${fmt(anniversary1)})에 지급 예정` };
    }
    if (anniversary1 <= jan1ThisYear) {
      const serviceYears = fullYearsBetween(hireDate, jan1ThisYear);
      const annual = annualFormula(Math.max(1, serviceYears));
      return { statusKey: "b", statusLabel: "정상 편입", granted: annual, anniversary: null, proRated: 0,
        detail: `${fmt(jan1ThisYear)} 기준 근속 ${serviceYears}년차 → 연차 ${annual}일 일괄 발생` };
    }
    const monthsWorked = fullMonthsBetween(hireDate, anniversary1);
    const monthlyLeave = Math.min(11, monthsWorked);
    const hireYearEnd = new Date(hireDate.getFullYear(), 11, 31);
    const daysInHireYear = daysBetween(hireDate, hireYearEnd) + 1;
    const proRated = round1((15 * daysInHireYear) / 365);
    return { statusKey: "c", statusLabel: "올해 1주년 도래", granted: round1(monthlyLeave + proRated), anniversary: anniversary1, proRated,
      detail: `월차 ${monthlyLeave}일 + 비례연차 ${proRated}일(1주년 ${fmt(anniversary1)} 지급) · 내년 1/1부터 정식 편입` };
  }

  function render() {
    const root = document.getElementById("leave-app");
    root.innerHTML = `<div class="loading-msg">대시보드를 불러오는 중…</div>`;

    let roster = [];
    let leaveLog = [];
    let editingId = null;
    let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    async function load() {
      if (fbDb) {
        // 실시간 동기화: 다른 사용자의 변경도 자동으로 반영됨
        fbDb.ref("roster").on("value", (snap) => { roster = objToArr(snap.val()); paint(); });
        fbDb.ref("logs").on("value", (snap) => { leaveLog = objToArr(snap.val()); paint(); });

        // 최초 1회: Firebase가 비어있고 이 브라우저에 기존 로컬 데이터가 있으면 업로드해서 이어받기
        fbDb.ref("roster").once("value").then((snap) => {
          if (!snap.val()) {
            try {
              const rawV2 = localStorage.getItem(ROSTER_KEY);
              const localRoster = rawV2 ? JSON.parse(rawV2) : [];
              if (localRoster.length) {
                fbDb.ref("roster").set(arrToObj(localRoster));
                const rawLog = localStorage.getItem(LOG_KEY);
                const localLog = rawLog ? JSON.parse(rawLog) : [];
                if (localLog.length) fbDb.ref("logs").set(arrToObj(localLog));
              }
            } catch (e) { /* 무시 */ }
          }
        });

        startAutoRefresh();
        return;
      }

      // Firebase 연결 실패 시: 이 브라우저에만 저장되는 기존 방식으로 대체
      try {
        const rawLog = localStorage.getItem(LOG_KEY);
        leaveLog = rawLog ? JSON.parse(rawLog) : [];
      } catch (e) { leaveLog = []; }
      try {
        const rawV2 = localStorage.getItem(ROSTER_KEY);
        if (rawV2) {
          roster = JSON.parse(rawV2);
        } else {
          const rawV1 = localStorage.getItem(ROSTER_KEY_V1);
          const v1 = rawV1 ? JSON.parse(rawV1) : [];
          roster = v1.map((r) => {
            const id = genId();
            const usedNum = Number(r.used) || 0;
            if (usedNum > 0) leaveLog.push({ id: genId(), empId: id, date: todayLocalStr(), type: "annual", days: usedNum });
            return { id, name: r.name || "", hireDate: r.hireDate, compGranted: 0 };
          });
          if (roster.length) { saveRoster(); saveLog(); }
        }
      } catch (e) { roster = []; }
      paint();
      startAutoRefresh();
    }

    async function saveRoster() {
      if (fbDb) { try { await fbDb.ref("roster").set(arrToObj(roster)); } catch (e) { console.error("Firebase 저장 실패", e); } return; }
      try { localStorage.setItem(ROSTER_KEY, JSON.stringify(roster)); } catch (e) { console.error("저장 실패", e); }
    }
    async function saveLog() {
      if (fbDb) { try { await fbDb.ref("logs").set(arrToObj(leaveLog)); } catch (e) { console.error("Firebase 저장 실패", e); } return; }
      try { localStorage.setItem(LOG_KEY, JSON.stringify(leaveLog)); } catch (e) { console.error("저장 실패", e); }
    }

    function startAutoRefresh() {
      lastDateStr = todayLocalStr();
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        const cur = todayLocalStr();
        if (cur !== lastDateStr) { lastDateStr = cur; paint(); }
        else { const clock = document.getElementById("live-clock"); if (clock) clock.textContent = fmtWeekday(new Date()); }
      }, 60 * 1000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          const cur = todayLocalStr();
          if (cur !== lastDateStr) { lastDateStr = cur; paint(); }
        }
      });
    }

    function sumLeave(empId, type) {
      return round1(leaveLog.filter((l) => l.empId === empId && l.type === type).reduce((s, l) => s + (Number(l.days) || 0), 0));
    }

    function exportExcel() {
      if (typeof XLSX === "undefined") { alert("엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요."); return; }
      const today = new Date();
      const summary = computeAll(today).map((c) => ({
        "이름": c.name, "입사일": fmt(c.hireDate), "상태": c.statusLabel,
        "연차발생": c.granted, "연차사용": c.usedAnnual, "연차잔여": c.remainingAnnual,
        "대체휴가발생": c.compGranted, "대체휴가사용": c.compUsed, "대체휴가잔여": c.compRemaining,
      }));
      const logRows = leaveLog
        .slice()
        .sort((a, b) => (a.date < b.date ? -1 : 1))
        .map((l) => {
          const emp = roster.find((r) => r.id === l.empId);
          return { "이름": emp ? emp.name : "(삭제된 직원)", "날짜": l.date, "유형": l.type === "annual" ? "연차" : "대체휴가", "일수": l.days };
        });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "직원현황");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logRows), "휴가사용내역");
      XLSX.writeFile(wb, `연차현황_${todayLocalStr()}.xlsx`);
    }

    function computeAll(today) {
      return roster.map((r) => {
        const hireDate = parseDate(r.hireDate);
        const result = calcLeave(hireDate, today);
        const usedAnnual = sumLeave(r.id, "annual");
        const compGranted = Number(r.compGranted) || 0;
        const compUsed = sumLeave(r.id, "comp");
        return {
          id: r.id, name: r.name || "-", hireDate, usedAnnual,
          remainingAnnual: round1(result.granted - usedAnnual),
          compGranted, compUsed, compRemaining: round1(compGranted - compUsed),
          ...result,
        };
      });
    }

    function paint() {
      const today = new Date();
      const computed = computeAll(today).filter((c) => c.hireDate);

      const countA = computed.filter((c) => c.statusKey === "a").length;
      const countB = computed.filter((c) => c.statusKey === "b").length;
      const countC = computed.filter((c) => c.statusKey === "c").length;
      const compGrantedTotal = round1(computed.reduce((s, c) => s + c.compGranted, 0));
      const compUsedTotal = round1(computed.reduce((s, c) => s + c.compUsed, 0));
      const compRemainingTotal = round1(compGrantedTotal - compUsedTotal);

      const upcoming = computed
        .filter((c) => c.anniversary && c.anniversary >= today)
        .map((c) => ({ ...c, dday: daysBetween(today, c.anniversary) }))
        .filter((c) => c.dday <= 90)
        .sort((a, b) => a.dday - b.dday);

      const empOptions = roster.map((r) => `<option value="${r.id}">${escapeHtml(r.name || "(이름없음)")}</option>`).join("");

      const rows = computed
        .sort((a, b) => a.hireDate - b.hireDate)
        .map((c) => {
          if (c.id === editingId) {
            const y = c.hireDate.getFullYear(), m = String(c.hireDate.getMonth() + 1).padStart(2, "0"), d = String(c.hireDate.getDate()).padStart(2, "0");
            return `
          <tr class="editing-row">
            <td><input type="text" class="edit-name" value="${escapeHtml(c.name)}" /></td>
            <td>${dateGroupHtml("edit-hire", y, m, d)}</td>
            <td><span class="status-pill status-${c.statusKey}">${c.statusLabel}</span></td>
            <td class="num">${c.granted}일</td>
            <td class="num">${c.usedAnnual}일</td>
            <td class="num">${c.remainingAnnual}일</td>
            <td><input type="number" class="edit-comp" min="0" step="0.5" value="${c.compGranted}" style="width:70px;" /></td>
            <td class="num">${c.compUsed}일</td>
            <td class="num">${c.compRemaining}일</td>
            <td class="detail">저장하면 반영됩니다</td>
            <td><button class="save-btn" data-id="${c.id}">저장</button><button class="cancel-btn" data-id="${c.id}">취소</button></td>
          </tr>`;
          }
          return `
          <tr>
            <td>${escapeHtml(c.name)}</td>
            <td>${fmt(c.hireDate)}</td>
            <td><span class="status-pill status-${c.statusKey}">${c.statusLabel}</span></td>
            <td class="num">${c.granted}일</td>
            <td class="num">${c.usedAnnual}일</td>
            <td class="num">${c.remainingAnnual}일</td>
            <td class="num">${c.compGranted}일</td>
            <td class="num">${c.compUsed}일</td>
            <td class="num">${c.compRemaining}일</td>
            <td class="detail">${c.detail}</td>
            <td><button class="edit-btn" data-id="${c.id}">수정</button><button class="del-btn" data-id="${c.id}">삭제</button></td>
          </tr>`;
        })
        .join("");

      const upcomingHtml = upcoming.length
        ? upcoming.map((u) => `
          <div class="upcoming-item">
            <div><div class="name">${escapeHtml(u.name)}</div><div class="meta">${fmt(u.anniversary)} 1주년 · 비례연차 ${u.proRated}일 예정</div></div>
            <span class="dday ${u.dday <= 14 ? "urgent" : ""}">${u.dday === 0 ? "오늘" : "D-" + u.dday}</span>
          </div>`).join("")
        : `<div class="empty-mini">90일 이내 비례연차 지급 예정자가 없습니다.</div>`;

      const recentLogs = leaveLog.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 8);
      const logsHtml = recentLogs.length
        ? recentLogs.map((l) => {
            const emp = roster.find((r) => r.id === l.empId);
            return `
          <div class="log-item">
            <div><span class="log-type ${l.type}">${l.type === "annual" ? "연차" : "대체"}</span>${escapeHtml(emp ? emp.name : "(삭제됨)")} · ${l.date} · ${l.days}일</div>
            <button class="log-del" data-id="${l.id}">삭제</button>
          </div>`;
          }).join("")
        : `<div class="empty-mini">등록된 휴가 사용 내역이 없습니다.</div>`;

      // 캘린더
      const y = calMonth.getFullYear(), m = calMonth.getMonth();
      const firstDow = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const todayStr = todayLocalStr();
      const logsByDate = {};
      leaveLog.forEach((l) => { (logsByDate[l.date] = logsByDate[l.date] || []).push(l); });

      let calCells = "";
      for (let i = 0; i < firstDow; i++) calCells += `<div class="cal-cell empty"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const entries = logsByDate[dStr] || [];
        const shown = entries.slice(0, 3);
        const chips = shown.map((l) => {
          const emp = roster.find((r) => r.id === l.empId);
          return `<span class="cal-chip ${l.type}">${escapeHtml(emp ? emp.name : "?")}</span>`;
        }).join("");
        const more = entries.length > 3 ? `<span class="cal-more">+${entries.length - 3}명</span>` : "";
        calCells += `<div class="cal-cell ${dStr === todayStr ? "today" : ""}"><div class="cal-daynum">${day}</div>${chips}${more}</div>`;
      }

      root.innerHTML = `
        <div class="top-row">
          <div>
            <div class="eyebrow">HR AUTOMATION · 크림웨이브 인사운영팀</div>
            <h1>연차 관리 대시보드</h1>
            <p class="sub">회계연도(매년 1/1) 기준 연차 · 입사 1주년 비례연차 · 대체휴가를 함께 관리합니다.</p>
          </div>
          <div class="top-right">
            <span class="sync-badge ${fbDb ? "on" : "off"}">${fbDb ? "🟢 실시간 공유 중" : "⚪ 이 브라우저에만 저장(로컬 모드)"}</span>
            <div class="today-box">
              <div class="label"><span class="live-dot"></span>오늘 기준 자동 계산</div>
              <div class="date" id="live-clock">${fmtWeekday(today)}</div>
              <div class="live">날짜가 바뀌면 자동으로 다시 계산됩니다</div>
            </div>
            <button class="xlsx-btn" id="xlsx-btn">⬇ 엑셀 다운로드</button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card accent-total"><div class="n">${computed.length}</div><div class="l">전체 등록 인원</div></div>
          <div class="stat-card accent-a"><div class="n">${countA}</div><div class="l">입사 1년 미만</div></div>
          <div class="stat-card accent-b"><div class="n">${countB}</div><div class="l">정상 편입</div></div>
          <div class="stat-card accent-c"><div class="n">${countC}</div><div class="l">올해 1주년 도래</div></div>
          <div class="stat-card accent-comp"><div class="n">${compGrantedTotal}일</div><div class="l">대체휴가 발생(합계)</div></div>
          <div class="stat-card accent-comp"><div class="n">${compRemainingTotal}일</div><div class="l">대체휴가 잔여(합계)</div></div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h2>다가오는 비례연차 지급 예정 <span class="count-badge">90일 이내 ${upcoming.length}명</span></h2>
            ${upcomingHtml}
          </div>
          <div class="card">
            <h2>직원 추가</h2>
            <div class="form-grid">
              <div class="full"><label>이름</label><input id="in-name" type="text" placeholder="예: OOO" /></div>
              <div><label>입사일</label>${dateGroupHtml("in-hire")}</div>
              <div><label>대체휴가 발생(일)</label><input id="in-comp" type="number" min="0" step="0.5" value="0" /></div>
            </div>
            <button class="btn" id="add-btn">직원 추가</button>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h2>휴가 사용 등록</h2>
            <div class="form-grid">
              <div class="full"><label>직원</label><select id="log-emp">${empOptions || '<option value="">등록된 직원 없음</option>'}</select></div>
              <div><label>날짜</label>${dateGroupHtml("log-date")}</div>
              <div><label>유형</label><select id="log-type"><option value="annual">연차</option><option value="comp">대체휴가</option></select></div>
              <div class="full"><label>사용 일수</label><input id="log-days" type="number" min="0.5" step="0.5" value="1" /></div>
            </div>
            <button class="btn secondary" id="log-add-btn">휴가 등록</button>
          </div>
          <div class="card">
            <h2>최근 휴가 사용 내역</h2>
            ${logsHtml}
          </div>
        </div>

        <div class="cal-card">
          <div class="cal-head">
            <h2 style="margin:0;">휴가 캘린더</h2>
            <div class="cal-nav">
              <button id="cal-prev">‹</button>
              <div class="cal-title">${y}년 ${m + 1}월</div>
              <button id="cal-next">›</button>
            </div>
          </div>
          <div class="cal-grid">
            <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div><div class="cal-dow">수</div>
            <div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>
            ${calCells}
          </div>
        </div>

        <div class="table-card">
          <div class="table-head">
            <h2 style="margin:0;">전체 직원 현황</h2>
            <span class="count-badge">총 ${computed.length}명</span>
          </div>
          <div class="table-scroll">
            <table>
              <thead><tr>
                <th>이름</th><th>입사일</th><th>상태</th><th>연차발생</th><th>연차사용</th><th>연차잔여</th>
                <th>대체발생</th><th>대체사용</th><th>대체잔여</th><th>산출 근거</th><th></th>
              </tr></thead>
              <tbody>${rows || `<tr><td colspan="11" class="empty">등록된 직원이 없습니다.</td></tr>`}</tbody>
            </table>
          </div>
          <div class="footnote">
            ※ 근로기준법 제60조 기준(15일 + 3년차부터 매 2년마다 1일 가산, 최대 25일)과 사내 회계연도 기준 연차 운영방식을 반영한 추정치입니다.
            연차·대체휴가 사용일수는 "휴가 사용 등록"에 입력한 내역의 합계로 자동 계산됩니다. 육아휴직·무급휴직 등 근속기간 산입 제외 사유는 반영되어 있지 않습니다.
            모든 데이터는 이 브라우저에만 저장되며, 최종 지급 연차일수는 인사운영팀 확인이 필요합니다.
          </div>
        </div>
      `;

      document.getElementById("xlsx-btn").onclick = exportExcel;

      document.getElementById("add-btn").onclick = () => {
        const name = document.getElementById("in-name").value.trim();
        const hireGroup = root.querySelector(".date-group.in-hire");
        const hire = getDateGroupValue(hireGroup);
        const comp = document.getElementById("in-comp").value;
        if (!hire) { hireGroup.querySelector(".dg-y").focus(); return; }
        roster.push({ id: genId(), name, hireDate: hire, compGranted: Number(comp) || 0 });
        saveRoster();
        paint();
      };

      document.getElementById("log-add-btn").onclick = () => {
        const empId = document.getElementById("log-emp").value;
        const dateGroup = root.querySelector(".date-group.log-date");
        const date = getDateGroupValue(dateGroup);
        const type = document.getElementById("log-type").value;
        const days = Number(document.getElementById("log-days").value) || 0;
        if (!empId) { alert("직원을 선택해주세요."); return; }
        if (!date) { dateGroup.querySelector(".dg-y").focus(); return; }
        if (days <= 0) { alert("사용 일수를 입력해주세요."); return; }
        leaveLog.push({ id: genId(), empId, date, type, days });
        saveLog();
        paint();
      };

      root.querySelectorAll(".log-del").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-id");
          leaveLog = leaveLog.filter((l) => l.id !== id);
          saveLog();
          paint();
        };
      });

      root.querySelectorAll(".del-btn").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-id");
          roster = roster.filter((r) => r.id !== id);
          leaveLog = leaveLog.filter((l) => l.empId !== id);
          saveRoster(); saveLog();
          paint();
        };
      });
      root.querySelectorAll(".edit-btn").forEach((btn) => { btn.onclick = () => { editingId = btn.getAttribute("data-id"); paint(); }; });
      root.querySelectorAll(".cancel-btn").forEach((btn) => { btn.onclick = () => { editingId = null; paint(); }; });
      root.querySelectorAll(".save-btn").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-id");
          const row = btn.closest("tr");
          const name = row.querySelector(".edit-name").value.trim();
          const hire = getDateGroupValue(row.querySelector(".date-group.edit-hire"));
          const comp = row.querySelector(".edit-comp").value;
          if (!hire) return;
          const emp = roster.find((r) => r.id === id);
          if (emp) { emp.name = name; emp.hireDate = hire; emp.compGranted = Number(comp) || 0; }
          editingId = null;
          saveRoster();
          paint();
        };
      });

      document.getElementById("cal-prev").onclick = () => { calMonth = new Date(y, m - 1, 1); paint(); };
      document.getElementById("cal-next").onclick = () => { calMonth = new Date(y, m + 1, 1); paint(); };

      root.querySelectorAll(".date-group").forEach(wireDateGroup);
    }

    load();
  }

  render();
})();
</script>
</body>
</html>
